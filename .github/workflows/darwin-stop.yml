name: Darwin stopped-daemon observation
on:
  push:
    branches: ['qualification/owned-process-darwin-intel-1b5811af']
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1b5811af2c274857abe9c0bfc28853c7d71e4f3b
      - uses: ./.github/actions/lean-ci-setup
      - name: Check native exit observation while the leader is stopped
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/native/owned_process_posix.c')
          s=p.read_text()
          s=s.replace('int main(void) {', """static int trace_fd;
          #undef assert
          #define assert(expr) do { if (!(expr)) { dprintf(trace_fd, "failed at line %d: %s (errno %d)\\n", __LINE__, #expr, errno); abort(); } } while (0)
          int main(void) {
            trace_fd = fcntl(STDERR_FILENO, F_DUPFD_CLOEXEC, 10);
            assert(trace_fd >= 10);""")
          mark='  assert(getsid(process.pid) == process.pid && getpgid(process.pid) == process.pid);'
          assert s.count(mark)==1
          p.write_text(s.replace(mark,mark+"""
            siginfo_t stopinfo = {0}, onlyexit = {0};
            assert(kill(process.pid, SIGSTOP) == 0);
            int sr = waitid(P_PID, process.pid, &stopinfo, WSTOPPED | WNOWAIT);
            dprintf(trace_fd, "stop waitid rc=%d errno=%d child=%d info pid=%d code=%d status=%d CLD_STOPPED=%d\\n", sr, errno, process.pid, stopinfo.si_pid, stopinfo.si_code, stopinfo.si_status, CLD_STOPPED);
            int er = waitid(P_PID, process.pid, &onlyexit, WEXITED | WNOHANG | WNOWAIT);
            dprintf(trace_fd, "exits-only waitid rc=%d errno=%d info pid=%d code=%d status=%d\\n", er, errno, onlyexit.si_pid, onlyexit.si_code, onlyexit.si_status);
            int exited = -1;
            er = peek_process(&process, &exited);
            dprintf(trace_fd, "Beam exit observation rc=%d exited=%d code=%u lost=%d\\n", er, exited, process.code, process.lost);
            assert(kill(process.pid, SIGCONT) == 0);
          """))
          PY
          bash tests/test-owned-process-posix.sh
      - name: Exercise the normal wrapper crash and stopped-daemon paths
        if: "!cancelled()"
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test-beam-wrapper-daemon.sh')
          s=p.read_text()
          mark='assert_json_field_equals "paused daemon status"'
          assert s.count(mark)==1
          s=s.replace(mark,'''if ! echo "$unresponsive_status" | python3 -c 'import json,sys;sys.exit(json.load(sys.stdin)["result"]["state"]!="unresponsive")'; then
            echo "Process state after failed status probe"
            ps -o pid,ppid,pgid,state,command -p "$unresponsive_pid" -p "$hold_pid" || true
            lsof -nP -a -p "$unresponsive_pid" -iTCP || true
            cat "$tmp1/owner-unresponsive.err"
            cat "$tmp1/.beam/beam-daemon-startup.log" 2>/dev/null || true
          fi
          '''+mark)
          p.write_text(s)
          p=Path('tests/test-beam-slow.sh')
          s=p.read_text()
          p.write_text(s[:s.index('run_step "MCP stdio stress"')]+s[s.index('run_step "wrapper daemon tests"'):s.index('run_step "wrapper tests"')])
          PY
          bash tests/test-beam-slow.sh
