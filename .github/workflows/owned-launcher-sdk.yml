name: Owned launcher Intel installed-helper qualification
on:
  push:
    branches: ['qualification/owned-process-intel-helper-5f1fdb5a']
permissions:
  contents: read
jobs:
  missing:
    name: Identify Intel helper cases blocked in the primary run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    outputs:
      sdks: ${{ steps.select.outputs.sdks }}
    steps:
      - name: Read terminal Intel job results
        id: select
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, subprocess, time
          from pathlib import Path
          base = 'repos/ejgallego/lean-beam-ci-macos/actions/runs/46029094385'
          toolchains = {
            'leanprover/lean4:v4.34.1', 'leanprover/lean4:v4.35.0',
            'leanprover/lean4:v4.36.0-rc1', 'leanprover/lean4:v4.37.0-rc1',
            'leanprover/lean4-nightly:nightly-2026-11-17'}
          deadline = time.monotonic() + 7000
          while time.monotonic() < deadline:
              data = subprocess.run(['gh','api',base+'/jobs?per_page=100'], capture_output=True, text=True)
              if data.returncode:
                  print(data.stderr, flush=True)
                  time.sleep(45)
                  continue
              jobs = json.loads(data.stdout)['jobs']
              intel = {m[1]: j for j in jobs
                       if (m := re.fullmatch(r'launcher \(macos-15-intel, ([^)]+)\)',j['name']))}
              assert set(intel).issubset(toolchains)
              if set(intel) == toolchains and all(j['status']=='completed' for j in intel.values()):
                  break
              time.sleep(30)
          else:
              raise TimeoutError('Intel prerequisites still queued after 7000 seconds')
          assert all(j['head_sha']=='8e37e995e0aaf5ce0d01d8ed651c881c5993cf82' for j in intel.values())
          missing = sorted(tc for tc,j in intel.items() if not any(
              step['name']=='Exercise installed launcher' and step['conclusion']=='success'
              for step in j.get('steps', [])))
          print('Running installed-helper suite independently for', missing, flush=True)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              print('sdks='+json.dumps(missing),file=out)
  launcher:
    needs: missing
    if: needs.missing.outputs.sdks != '[]'
    runs-on: macos-15-intel
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.missing.outputs.sdks) }}
    env:
      ELAN_TOOLCHAIN: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5f1fdb5a9dbe505f42c7105783344d4c8bc39857
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify signed product checkout and runner architecture
        shell: python
        run: |
          import platform, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          arch = platform.machine().lower()
          print(f'product={sha} architecture={arch}', flush=True)
          assert sha == '5f1fdb5a9dbe505f42c7105783344d4c8bc39857' and arch in ('x86_64', 'amd64')

      - name: Install elan
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Exercise installed launcher
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          env = dict(os.environ)
          subprocess.run(['elan', 'toolchain', 'install', env['ELAN_TOOLCHAIN']], check=True)
          subprocess.run(['lean', '--version'], check=True, env=env)
          prefix = Path(subprocess.check_output(['lean','--print-prefix'],text=True,env=env).strip())
          print(f"Testing {env['ELAN_TOOLCHAIN']} with {prefix}", flush=True)
          effective = Path(subprocess.check_output(['lake', 'env', 'lean', '--print-prefix'], text=True, env=env).strip())
          assert effective.resolve() == prefix.resolve(), (effective, prefix)
          env['PATH'] = str(prefix / 'bin') + os.pathsep + env['PATH']
          subprocess.run(['lake', '-R', 'build', 'Beam.LSP:shared', 'beam-installation-stage-fixture',
                          'beam-lake-helper-client-fixture', 'beam-cli', 'beam-daemon', 'lean-beam-mcp'],
                         check=True, env=env)
          subprocess.run([sys.executable, 'tests/test-lake-helper-lifetime.py'],check=True,env=env)

      - name: Observe FIFO EOF after collection in the failed native fixture
        if: matrix.sdk == 'leanprover/lean4:v4.37.0-rc1' && !cancelled()
        shell: python
        run: |
          import subprocess, tempfile
          from pathlib import Path
          source = Path('tests/native/owned_process_posix.c')
          original = source.read_text()
          assertion = '  assert(poll(&output, 1, 3000) == 1);'
          assert original.count(assertion) == 1
          diagnostic = r"""
            int ready = poll(&output, 1, 3000);
            int poll_error = ready < 0 ? errno : 0;
            int flags = fcntl(output.fd, F_GETFL);
            assert(flags >= 0 && fcntl(output.fd, F_SETFL, flags | O_NONBLOCK) == 0);
            char observed;
            ssize_t n = read(output.fd, &observed, 1);
            int read_error = n < 0 ? errno : 0;
            fprintf(stderr, "after_handoff poll=%d revents=%d poll_errno=%d read=%zd read_errno=%d\n",
                    ready, (int) output.revents, poll_error, n, read_error);
            assert(n == 0);
          """
          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              probe = tmp / 'observe.c'
              probe.write_text(original.replace(assertion,diagnostic))
              sdk = Path(subprocess.check_output(['lean','--print-prefix'],text=True).strip())
              lib = sdk / 'lib' / 'lean'
              exe = tmp / 'observe'
              subprocess.run(['cc','-std=c11', '-I'+str(source.parent.resolve()), '-I'+str(sdk/'include'),
                              str(probe), '-L'+str(lib), '-Wl,-rpath,'+str(lib), '-lleanshared',
                              '-pthread','-o',str(exe)],check=True)
              subprocess.run([str(exe)],check=True,timeout=30)
