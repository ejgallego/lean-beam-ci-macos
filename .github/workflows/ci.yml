name: Windows runtime crash diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-debug:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - name: Install Elan
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/elan.zip"
          Expand-Archive "$env:RUNNER_TEMP/elan.zip" "$env:RUNNER_TEMP/elan"
          & "$env:RUNNER_TEMP/elan/elan-init.exe" -y --default-toolchain none
          "$env:USERPROFILE/.elan/bin" >> $env:GITHUB_PATH
      - uses: msys2/setup-msys2@v2
        id: sdk
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-gmp mingw-w64-clang-x86_64-libuv mingw-w64-clang-x86_64-gdb
      - name: Select native SDK
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.sdk.outputs.msys2-location }}
        run: '"$env:MSYS2_LOCATION/clang64/bin" >> $env:GITHUB_PATH'
      - name: Exercise exact qualification runtime under debugger
        shell: bash
        env:
          DIAG_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          git show --no-patch --format=fuller HEAD
          lean --version
          "$DIAG_PYTHON" --version
          lean_prefix="$("$DIAG_PYTHON" -c 'from pathlib import Path; import subprocess; print(Path(subprocess.check_output(["elan", "which", "lean"], text=True).strip()).parent.parent)')"
          native_include="$("$DIAG_PYTHON" -c 'from pathlib import Path; import shutil; print(Path(shutil.which("clang")).resolve().parent.parent / "include")')"
          gdb --version
          "$DIAG_PYTHON" -X utf8 scripts/windows-crash-diagnostic.py "$lean_prefix" --crlf --native-system-include-dir "$native_include"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-client-stack-evidence
          include-hidden-files: true
          retention-days: 7
          path: |
            .native-debug/**
            .native-test/**/owner.log
            .native-test/**/postponed-owner.log
            .native-test/**/.beam/*.log
            .native-test/**/.beam/*.json
            .lake/toolchain-build.json
            .lake/toolchain-build/native/*.trace
