name: Focused Darwin helper qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-darwin-b17ce42
  cancel-in-progress: false

jobs:
  native-toolchain:
    name: native-toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b17ce42af7a2a446085dc16dbadf374139393e65

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify corrective source identity
        shell: bash
        run: |
          git show -s --format='%H %T %s' HEAD
          echo "runner_os=${{ runner.os }} runner_arch=${{ runner.arch }}"
          case "${{ matrix.os }}" in
            macos-latest) test "${{ runner.arch }}" = ARM64 ;;
            macos-15-intel) test "${{ runner.arch }}" = X64 ;;
          esac
          test "$(git rev-parse HEAD)" = "b17ce42af7a2a446085dc16dbadf374139393e65"
          test "$(git rev-parse HEAD^{tree})" = "eae635a10f4681fbc4f7b1224e2b662a6312fe69"

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build, relocate, and exercise native toolchain
        shell: bash
        run: |
          lean --version
          lean_prefix="$(python -c 'from pathlib import Path; import subprocess; print(Path(subprocess.check_output(["elan", "which", "lean"], text=True).strip()).parent.parent)')"
          python tests/test-native-toolchain.py "$lean_prefix" --crlf

      - name: Retain native runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-runtime-diagnostics-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .native-test/**/owner.log
            .native-test/**/postponed-owner.log
            .native-test/**/.beam/*.log
            .native-test/**/.beam/*.json

      - name: Retain native qualification identity
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-qualification-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .lake/toolchain-build.json
            .lake/toolchain-build/native/control_dir.o.trace
            .lake/toolchain-build/native/process_job.o.trace
            .native-test/**/lib/lean-beam/provenance.json
