name: Qualify Windows local toolchain links

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-windows-local-links-5cc8b8c
  cancel-in-progress: false

jobs:
  windows-native-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5cc8b8ca7fb155d9a9cb4b27568bc824d77d65a9

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify corrective source identity
        shell: bash
        run: |
          mkdir -p .beam/windows-local-links
          git show -s --format='%H %T %s' HEAD
          echo "runner_os=${{ runner.os }} runner_arch=${{ runner.arch }}"
          test "${{ runner.os }}" = Windows
          test "${{ runner.arch }}" = X64
          test "$(git rev-parse HEAD)" = "5cc8b8ca7fb155d9a9cb4b27568bc824d77d65a9"
          test "$(git rev-parse 'HEAD^{tree}')" = "1d0505728ac14dd21d017e4e7118f07b0462c7aa"

      - name: Install Windows elan
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/elan.zip"
          Expand-Archive "$env:RUNNER_TEMP/elan.zip" "$env:RUNNER_TEMP/elan"
          & "$env:RUNNER_TEMP/elan/elan-init.exe" -y --default-toolchain none
          "$env:USERPROFILE/.elan/bin" >> $env:GITHUB_PATH

      - uses: msys2/setup-msys2@v2
        id: native-msys2
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-gmp mingw-w64-clang-x86_64-libuv

      - name: Select Windows compiler
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.native-msys2.outputs.msys2-location }}
        run: '"$env:MSYS2_LOCATION/clang64/bin" >> $env:GITHUB_PATH'

      - name: Qualify Windows process watchdog
        shell: bash
        run: python tests/test-process-watchdog.py

      - name: Full native Windows construction and runtime
        shell: bash
        run: |
          lean --version | tee .beam/windows-local-links/compiler.txt
          elan --version | tee .beam/windows-local-links/elan.txt
          clang --version > .beam/windows-local-links/native-clang.txt
          clang --print-resource-dir > .beam/windows-local-links/native-resource.txt
          lean_prefix="$(python -c 'from pathlib import Path; import subprocess; print(Path(subprocess.check_output(["elan", "which", "lean"], text=True).strip()).parent.parent)')"
          test "$("$lean_prefix/bin/lean.exe" --githash)" = c9afcddf514a6772bd4d649f7cfc04eff0b9f15e
          # Full native path: real Elan lookup, ordinary self-check fault fixtures,
          # shared-runtime/configuration isolation, then actual native build and runtime.
          # No --skip-build omission in this qualification.
          python tests/test-native-toolchain.py "$lean_prefix" --crlf
          python - <<'PYTHON'
          import json
          from pathlib import Path
          record = json.loads(Path(".lake/toolchain-build.json").read_text(encoding="utf-8"))
          assert record["sourceCommit"] == "5cc8b8ca7fb155d9a9cb4b27568bc824d77d65a9", record
          assert record["schemaVersion"] == 3 and len(record["artifacts"]) == 5, record
          assert record["components"]["targets"][0]["compilerRevision"] == "c9afcddf514a6772bd4d649f7cfc04eff0b9f15e", record
          PYTHON

      - name: Retain native runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-runtime-diagnostics-windows-x86_64
          include-hidden-files: true
          path: |
            .native-test/**/owner.log
            .native-test/**/postponed-owner.log
            .native-test/**/.beam/*.log
            .native-test/**/.beam/*.json

      - name: Retain native qualification identity
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-runtime-qualification-windows-x86_64
          include-hidden-files: true
          path: |
            .beam/windows-local-links/**
            .lake/build/native/control_dir.o.trace
            .lake/build/native/process_job.o.trace
            .lake/toolchain-build.json
            .lake/toolchain-build/native/control_dir.o.trace
            .lake/toolchain-build/native/process_job.o.trace
            .native-test/**/lib/lean-beam/provenance.json
