name: Diagnose Windows helper cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-windows-helper-diagnostic-cc8530d
  cancel-in-progress: false

jobs:
  windows-helper-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cc8530d839928279a13bb430d1de39b6d9a1cb73

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify diagnostic source identity
        shell: bash
        run: |
          mkdir -p .beam/windows-helper-diagnostic
          git show -s --format='%H %T %s' HEAD | tee .beam/windows-helper-diagnostic/source.txt
          test "$(git rev-parse HEAD)" = "cc8530d839928279a13bb430d1de39b6d9a1cb73"
          test "$(git rev-parse 'HEAD^{tree}')" = "74c2a01917cd575073908815360ed5b7f070609f"
          test "${{ runner.os }}" = Windows
          test "${{ runner.arch }}" = X64

      - name: Install Windows elan
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/elan.zip"
          Expand-Archive "$env:RUNNER_TEMP/elan.zip" "$env:RUNNER_TEMP/elan"
          & "$env:RUNNER_TEMP/elan/elan-init.exe" -y --default-toolchain none
          "$env:USERPROFILE/.elan/bin" >> $env:GITHUB_PATH

      - uses: msys2/setup-msys2@v2
        id: native-msys2
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld mingw-w64-clang-x86_64-gmp mingw-w64-clang-x86_64-libuv

      - name: Select Windows compiler
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.native-msys2.outputs.msys2-location }}
        run: '"$env:MSYS2_LOCATION/clang64/bin" >> $env:GITHUB_PATH'

      - name: Build actual Lean Child boundary fixture
        shell: bash
        run: |
          lean --version
          lean_prefix="$(python -c 'from pathlib import Path; import subprocess; print(Path(subprocess.check_output(["elan", "which", "lean"], text=True).strip()).parent.parent)')"
          test "$("$lean_prefix/bin/lean.exe" --githash)" = c9afcddf514a6772bd4d649f7cfc04eff0b9f15e
          export LEAN="$lean_prefix/bin/lean.exe"
          export LEAN_SYSROOT="$lean_prefix"
          export LAKE_CACHE_DIR=""
          BEAM_NATIVE_CLANG_RESOURCE_DIR="$(clang --print-resource-dir)"
          export BEAM_NATIVE_CLANG_RESOURCE_DIR
          "$lean_prefix/bin/lean.exe" --version > .beam/windows-helper-diagnostic/compiler.txt
          clang --version >> .beam/windows-helper-diagnostic/compiler.txt
          printf '%s\n' "$BEAM_NATIVE_CLANG_RESOURCE_DIR" > .beam/windows-helper-diagnostic/native-sdk.txt
          "$lean_prefix/bin/lake.exe" --reconfigure -KbeamToolchain=false --no-cache build beam-lake-helper-client-fixture
          python -c 'import os; from pathlib import Path; Path(".beam/windows-helper-diagnostic/lean-prefix.txt").write_text(os.environ["LEAN_SYSROOT"], encoding="utf-8")'

      - name: Observe job close then retained Child cleanup
        shell: bash
        run: |
          python tests/lib/process_watchdog.py --timeout 120 -- .lake/build/bin/beam-lake-helper-client-fixture.exe --process-job-close-diagnostic > .beam/windows-helper-diagnostic/boundary.jsonl 2> .beam/windows-helper-diagnostic/boundary.stderr
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path(".beam/windows-helper-diagnostic")
          rows = [json.loads(line) for line in (evidence / "boundary.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows) == 72 and sum(row["job"] for row in rows) == 64, rows
          assert all(row["windows"] for row in rows), rows
          summary = {"diagnostic_only": True, "qualification": False, "cases": len(rows), "groups": {}}
          for job in [False, True]:
              group = [row for row in rows if row["job"] == job]
              summary["groups"][str(job)] = {"cases": len(group), "errors": {
                  key: sum(row[key] is not None for row in group)
                  for key in ["scope_error", "terminate_error", "try_wait_error", "wait_error"]}}
          (evidence / "boundary-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Construct real target helper in ephemeral runner SDK
        shell: bash
        run: |
          lean_prefix="$(cat .beam/windows-helper-diagnostic/lean-prefix.txt)"
          cmake "-DLEAN_PREFIX=$lean_prefix" -P scripts/build-toolchain.cmake
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          evidence = Path(".beam/windows-helper-diagnostic")
          sdk = Path((evidence / "lean-prefix.txt").read_text(encoding="utf-8"))
          manifest = json.loads(Path(".lake/toolchain-build.json").read_text(encoding="utf-8"))
          assert manifest["sourceCommit"] == "cc8530d839928279a13bb430d1de39b6d9a1cb73", manifest
          assert manifest["schemaVersion"] == 3 and len(manifest["artifacts"]) == 5, manifest
          assert manifest["components"]["targets"][0]["compilerRevision"] == "c9afcddf514a6772bd4d649f7cfc04eff0b9f15e", manifest
          # Add only absent Beam files to this job's fresh SDK. Do not overwrite compiler inputs.
          for artifact in manifest["artifacts"]:
              assert not (sdk / artifact["destination"]).exists(), artifact
          subprocess.run(["cmake", f"-DLEAN_PREFIX={sdk}", f"-DPREFIX={sdk}", "-P", "scripts/install-toolchain.cmake"], check=True)
          installed = (sdk / "lib/lean-beam/provenance.json").read_bytes()
          assert installed == Path(".lake/toolchain-build.json").read_bytes()
          (evidence / "installed-provenance.json").write_bytes(installed)
          project = evidence.resolve() / "project with spaces"
          project.mkdir()
          (project / "lakefile.toml").write_text('name = "helper_diagnostic"\n[[lean_lib]]\nname = "Main"\n', encoding="utf-8")
          (project / "Main.lean").write_text("def answer : Nat := 42\n", encoding="utf-8")
          PY

      - name: Observe actual server-env requests
        shell: bash
        run: |
          lean_prefix="$(cat .beam/windows-helper-diagnostic/lean-prefix.txt)"
          project="$(python -c 'from pathlib import Path; print(Path(".beam/windows-helper-diagnostic/project with spaces").resolve())')"
          python tests/lib/process_watchdog.py --timeout 180 -- .lake/build/bin/beam-lake-helper-client-fixture.exe --real-helper-diagnostic "$lean_prefix/bin/beam-daemon.exe" "$project" > .beam/windows-helper-diagnostic/helper.jsonl 2> .beam/windows-helper-diagnostic/helper.stderr
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path(".beam/windows-helper-diagnostic")
          rows = [json.loads(line) for line in (evidence / "helper.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows) == 8, rows
          summary = {"diagnostic_only": True, "qualification": False, "requests": len(rows),
                     "successes": sum("result" in row["response"] for row in rows),
                     "errors": [row for row in rows if "error" in row["response"]]}
          (evidence / "helper-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Retain diagnostic observations and native identity
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-helper-cleanup-diagnostic
          include-hidden-files: true
          path: |
            .beam/windows-helper-diagnostic/**
            .lake/toolchain-build.json
            .lake/toolchain-build/native/control_dir.o.trace
            .lake/toolchain-build/native/process_job.o.trace
