name: Final native Mac Intel qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-native-ceb578f-macos-intel
  cancel-in-progress: false

jobs:
  native-macos-intel:
    name: native-toolchain (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      LAKE_CACHE_DIR: ''
      CCACHE_READONLY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: leanprover/lean-beam
          ref: ceb578fa236f82d9b2163100ef34ae58af9d2cfc

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify reviewed source and architecture
        shell: bash
        run: |
          test "${{ runner.os }}" = macOS
          test "${{ runner.arch }}" = X64
          test "$(git rev-parse HEAD)" = ceb578fa236f82d9b2163100ef34ae58af9d2cfc
          test "$(git rev-parse HEAD^{tree})" = 59ee9903535195a811d304304b9c6b099d2e940e
          git diff --exit-code

      - name: Install selected Lean SDK
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(head -n 1 lean-toolchain)"

      - name: Build, relocate, and exercise complete native toolchain
        shell: bash
        run: |
          unset LEAN LEAN_SYSROOT LEAN_PATH LEAN_SRC_PATH ELAN_TOOLCHAIN LAKE_HOME LEAN_CC LEAN_AR
          test "$(lean --githash)" = c9afcddf514a6772bd4d649f7cfc04eff0b9f15e
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def read(*command):
              return subprocess.check_output(command, text=True).strip()
          evidence = pathlib.Path('.beam/final-gate')
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / 'source-sdk.json').write_text(json.dumps({
              'head': read('git', 'rev-parse', 'HEAD'),
              'tree': read('git', 'rev-parse', 'HEAD^{tree}'),
              'lean_version': read('lean', '--version'),
              'compiler_revision': read('lean', '--githash'),
              'lean_prefix': read('lean', '--print-prefix'),
              'lake_version': read('lake', '--version'),
              'lake_cache_dir': os.environ.get('LAKE_CACHE_DIR'),
              'scope': 'complete native test; no skip-build or runtime-only omissions'
          }, indent=2) + '\n')
          PY
          lean_prefix="$(lean --print-prefix)"
          python3 tests/test-native-toolchain.py "$lean_prefix" --crlf

      - name: Preserve source and native qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: final-native-macos-intel-ceb578f
          include-hidden-files: true
          path: |
            .beam/final-gate/**
            .lake/toolchain-build.json
            .lake/toolchain-build/native/control_dir.o.trace
            .lake/toolchain-build/native/process_job.o.trace
            .native-test/**/lib/lean-beam/provenance.json
            .native-test/**/owner.log
            .native-test/**/postponed-owner.log
            .native-test/**/.beam/*.log
            .native-test/**/.beam/*.json
