name: Darwin process-group diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-darwin-process-diagnostic-ac3753c
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ac3753c8fea50ed55b96762cfd3de70b534a39fe

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify diagnostic source
        shell: bash
        run: |
          git show -s --format='%H %T %s' HEAD
          test "$(git rev-parse HEAD)" = "ac3753c8fea50ed55b96762cfd3de70b534a39fe"
          test "$(git rev-parse HEAD^{tree})" = "fd3141f1d7b11a638a2ae5321dc5c8c8b3aa17e0"
          test "${{ runner.os }}" = macOS
          test "${{ runner.arch }}" = X64
          shasum -a 256 tests/fixtures/darwin-process-group-diagnostic.c

      - name: Observe owned process groups
        shell: bash
        run: |
          mkdir -p .beam/darwin-diagnostic
          sw_vers > .beam/darwin-diagnostic/host.txt
          uname -a >> .beam/darwin-diagnostic/host.txt
          xcrun --show-sdk-path > .beam/darwin-diagnostic/sdk-path.txt
          xcrun clang --version > .beam/darwin-diagnostic/compiler.txt
          cp tests/fixtures/darwin-process-group-diagnostic.c .beam/darwin-diagnostic/source.c
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror tests/fixtures/darwin-process-group-diagnostic.c -o "$RUNNER_TEMP/beam-process-group-diagnostic"
          python tests/lib/process_watchdog.py --timeout 30 -- "$RUNNER_TEMP/beam-process-group-diagnostic" > .beam/darwin-diagnostic/observations.jsonl 2> .beam/darwin-diagnostic/stderr.txt

      - name: Retain syscall observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: darwin-process-group-diagnostic
          include-hidden-files: true
          path: .beam/darwin-diagnostic/
